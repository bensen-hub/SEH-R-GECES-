name: Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: ZIP'i aç
        run: |
          unzip -o sehir-gecesi-android-project.zip -d android-project

      - name: Gradle kurulumu
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK oluştur
        run: |
          gradle -p android-project assembleDebug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: sehir-gecesi-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
